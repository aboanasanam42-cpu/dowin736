name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (API 35)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$GITHUB_WORKSPACE/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Keystore (if provided in GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> $GITHUB_ENV
          fi

      - name: Build APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Executing Gradle build for: $BUILD_TYPE..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Organize Generated APKs
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apks/ \;
          echo "Generated APK Files:"
          ls -la output_apks/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rahman-Clinic-Debts-APKs
          path: output_apks/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release != 'false'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APKs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Release ${{ steps.release_tag.outputs.tag }} - حسابات ديون عيادة الرحمن"
          body: |
            ### 🏥 تطبيق حسابات ديون المرضى لعيادة الرحمن
            **إصدار جاهز للتحميل والتثبيت المباشر على أجهزة أندرويد.**

            #### 📋 محتويات وتحديثات الإصدار:
            - دعم كامل لنظام أندرويد 15 (Target SDK 35).
            - تسجيل المرضى مع خاصية الدمج التلقائي الذكي للبيانات ومنع التكرار.
            - حساب إجمالي العلاج، الواصل، والباقي بدقة.
            - جدولة وإرسال رسائل التذكير SMS يدوياً وتلقائياً مع تحديد الوقت والتاريخ واليوم.
            - النسخ الاحتياطي للهاتف وتصدير التقارير إلى PDF و Excel (.csv/.xlsx).
            - واجهة كاملة باللغة العربية متطابقة مع التصميم الداكن الفاخر.

            #### 📥 روابط التنزيل المباشر:
            - قم بتنزيل ملف الـ APK المرفق أدناه وتثبيته على هاتفك فوراً.
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
